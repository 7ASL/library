<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Local Library</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <div class="container">
                <a href="/" class="logo">library</a>
                <button type="button" class="sign-btn btn-primary">Sign in</button>
            </div>
        </header>
        <main>
            <div class="center">
                <button command="show-modal" commandfor="add-book" id="openAddMenu" class="btn-primary">+ Add book</button>
                <dialog id="add-book" closedby="any">
                    <h2>Add new book</h2>
                    <form id="book-form">
                        <label for="title">Title:</label>
                        <input type="text" name="title" id="title" required>
                        <label for="author">Author:</label>
                        <input type="text" name="author" id="author" required>
                        <label for="numOfPages">Number of pages:</label>
                        <input type="number" name="numOfPages" id="numOfPages" min="1" required>
                        <label for="isRead">Have you read it?
                            <input type="checkbox" name="isRead" id="isRead">
                        </label>
                        <button type="sumbit" class="btn-primary">Add book</button>
                    </form>
                </dialog>
            </div>
            <div id="book-grid"></div>
        </main>
        <footer>
            <p>
                &copy <span id="year"></span> Library &middot Made by
                <a href="https://github.com/7ASL" target="_blank" rel="noopener noreerrer">
                    @7ASL
                </a>
            </p>
        </footer>
    </body>
</html>
